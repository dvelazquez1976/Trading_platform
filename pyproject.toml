[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "2.0.0"
description = "Plataforma personal de análisis técnico de acciones"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "pandas-ta>=0.3.14b",
    "yfinance>=0.2.28",
    "plotly>=5.17",
    "streamlit>=1.35",
    "tabulate>=0.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
trading-platform = "trading_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
